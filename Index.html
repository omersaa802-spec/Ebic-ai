<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ebic ai - Study & Gaming Controller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #050811;
      color: #f8fafc;
      min-height: 100vh;
    }
    
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    .glow-cyan {
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
      border-color: #06b6d4;
    }

    .glow-pink {
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.35);
      border-color: #f43f5e;
    }

    .glow-purple {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
      border-color: #a855f7;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }

    .mic-listening {
      animation: pulse-mic 1s infinite ease-in-out;
      background-color: #ef4444 !important;
      border-color: #f87171 !important;
    }

    @keyframes float-bot {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .bot-anim {
      animation: float-bot 3.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-start p-4 sm:p-6 select-none">

  <header class="w-full max-w-md text-center my-4">
    <div class="inline-block relative">
      <h1 class="font-orbitron text-4xl sm:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-rose-500 drop-shadow-[0_0_15px_rgba(168,85,247,0.5)]">
        ebic ai
      </h1>
      <span class="absolute -top-2 -right-6 text-[10px] font-orbitron bg-cyan-500/20 text-cyan-300 border border-cyan-500/50 px-1.5 py-0.5 rounded-full uppercase tracking-widest">
        v2.0
      </span>
    </div>
    <p class="text-xs sm:text-sm text-slate-400 font-semibold tracking-wide mt-1 uppercase">
      Dual Focus & Game Time Controller
    </p>
  </header>

  <main class="w-full max-w-md flex flex-col gap-4">

    <section class="bg-slate-900/90 border border-purple-500/40 rounded-2xl p-4 flex items-center gap-3 backdrop-blur-md transition-all duration-300" id="aiBox">
      <div class="text-3xl sm:text-4xl bot-anim flex-shrink-0">🤖</div>
      <div class="flex-1 min-w-0">
        <div class="text-[10px] font-orbitron font-bold text-purple-400 uppercase tracking-widest flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-purple-400 animate-ping"></span>
          ebic companion
        </div>
        <div id="aiSpeech" class="text-xs sm:text-sm text-purple-100 italic font-medium truncate mt-0.5">
          "Say 'game on' or click voice to give commands!"
        </div>
      </div>
      <button id="micBtn" onclick="toggleVoiceControl()" class="flex-shrink-0 bg-purple-600 hover:bg-purple-500 border border-purple-400 text-white text-xs font-orbitron font-bold px-3 py-2.5 rounded-xl transition-all active:scale-95 flex items-center gap-1.5 shadow-lg shadow-purple-900/50">
        <span>🎤</span>
        <span id="micText">VOICE</span>
      </button>
    </section>

    <section class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3">
      <div class="flex flex-col gap-1">
        <label for="taskInput" class="text-[11px] font-orbitron font-bold text-cyan-400 uppercase tracking-wider">
          📝 Study Quest / Subject
        </label>
        <input 
          type="text" 
          id="taskInput" 
          placeholder="e.g. Physics Chapter 4 / Math Drills" 
          onchange="onTaskEntered()"
          class="bg-slate-950 border border-slate-800 focus:border-cyan-500 text-slate-100 text-sm rounded-xl px-3 py-2 outline-none transition-all placeholder:text-slate-600 font-medium"
        />
      </div>

      <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-800/80">
        <label for="fileUpload" class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold text-xs px-3 py-2 rounded-xl transition-all flex items-center gap-2">
          <span>📁 Attach Doc</span>
        </label>
        <input type="file" id="fileUpload" class="hidden" onchange="onFileAttached(event)" />
        <span id="fileName" class="text-xs text-emerald-400 font-medium truncate max-w-[200px] text-right">
          No file attached
        </span>
      </div>
    </section>

    <!-- STUDY TIMER CARD -->
    <section id="studyCard" class="bg-slate-900/80 border-2 border-slate-800 rounded-2xl p-4 text-center transition-all duration-300">
      <div class="text-xs font-orbitron font-extrabold text-cyan-400 uppercase tracking-widest flex items-center justify-center gap-2">
        <span>📖</span> STUDY TIMER
      </div>
      <div id="studyTimer" class="font-orbitron text-5xl sm:text-6xl font-black text-cyan-300 my-2 tracking-wider drop-shadow-md">
        25:00
      </div>
      <div class="flex justify-center gap-2 mt-2">
        <button onclick="setStudyTime(15)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition-all">15m</button>
        <button onclick="setStudyTime(25)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition-all">25m</button>
        <button onclick="setStudyTime(45)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition-all">45m</button>
      </div>
    </section>

    <!-- GAME TIMER CARD -->
    <section id="gameCard" class="bg-slate-900/80 border-2 border-slate-800 rounded-2xl p-4 text-center transition-all duration-300">
      <div class="text-xs font-orbitron font-extrabold text-rose-400 uppercase tracking-widest flex items-center justify-center gap-2">
        <span>🎮</span> GAME BREAK BANK
      </div>
      <div id="gameTimer" class="font-orbitron text-5xl sm:text-6xl font-black text-rose-400 my-2 tracking-wider drop-shadow-md">
        10:00
      </div>
      <div class="flex justify-center gap-2 mt-2">
        <button onclick="setGameTime(5)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition-all">5m</button>
        <button onclick="setGameTime(10)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition-all">10m</button>
        <button onclick="setGameTime(15)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition-all">15m</button>
      </div>
    </section>

    <section class="grid grid-cols-2 gap-3">
      <button onclick="startStudy()" class="bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white font-orbitron font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-cyan-900/40 border border-cyan-400 text-xs uppercase tracking-wider transition-all">
        Start Study
      </button>
      <button onclick="startGame()" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-orbitron font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-rose-900/40 border border-rose-400 text-xs uppercase tracking-wider transition-all">
        Game On
      </button>
      <button onclick="resetTimers()" class="col-span-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-orbitron font-bold py-3 px-4 rounded-xl border border-slate-700 text-xs uppercase tracking-wider transition-all">
        Pause / Reset
      </button>
    </section>

    <footer class="bg-slate-900/60 border border-slate-800 rounded-2xl p-3.5 flex justify-around text-center">
      <div>
        <div id="totalStudied" class="font-orbitron text-xl font-extrabold text-cyan-400">0m</div>
        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Studied Today</div>
      </div>
      <div class="w-px bg-slate-800"></div>
      <div>
        <div id="totalPlayed" class="font-orbitron text-xl font-extrabold text-rose-400">0m</div>
        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Played Today</div>
      </div>
    </footer>

  </main>

  <script>
    let studySeconds = 25 * 60;
    let gameSeconds = 10 * 60;
    
    let activeInterval = null;
    let mode = 'idle'; // 'study', 'game', 'idle'

    let totalStudiedSec = 0;
    let totalPlayedSec = 0;
    let attachedFileName = "";

    // Speech Synthesis (AI Speaking Out Loud)
    function speakAI(text) {
      document.getElementById('aiSpeech').innerText = `"${text}"`;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Web Audio Chime Alerts (For Background & Mode Switch)
    function playChime(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'alert') {
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12); // A5
        } else {
          osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.12); // E5
        }

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {
        console.log("Audio play error:", e);
      }
    }

    function onTaskEntered() {
      const task = document.getElementById('taskInput').value.trim();
      if (task) {
        speakAI(`Quest accepted: ${task}. Let's crush this session!`);
      }
    }

    function onFileAttached(e) {
      const file = e.target.files[0];
      if (file) {
        attachedFileName = file.name;
        document.getElementById('fileName').innerText = file.name;
        speakAI(`Document ${file.name} connected to ebic ai!`);
      }
    }

    // Voice Command Listening ("game on", "study on", "pause")
    let recognition = null;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        isListening = true;
        const btn = document.getElementById('micBtn');
        btn.classList.add('mic-listening');
        document.getElementById('micText').innerText = 'LISTENING';
      };

      recognition.onresult = function(event) {
        const command = event.results[0][0].transcript.toLowerCase().trim();
        stopMicUI();

        if (command.includes('game on') || command.includes('start game') || command.includes('game time')) {
          startGame();
        } else if (command.includes('study on') || command.includes('start study') || command.includes('study time')) {
          startStudy();
        } else if (command.includes('pause') || command.includes('stop') || command.includes('reset')) {
          resetTimers();
        } else {
          speakAI(`Recognized: "${command}". Try saying "game on"!`);
        }
      };

      recognition.onerror = stopMicUI;
      recognition.onend = stopMicUI;
    }

    function stopMicUI() {
      isListening = false;
      const btn = document.getElementById('micBtn');
      btn.classList.remove('mic-listening');
      document.getElementById('micText').innerText = 'VOICE';
    }

    function toggleVoiceControl() {
      if (!recognition) {
        alert("Speech recognition is not supported on this browser.");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplays() {
      document.getElementById('studyTimer').innerText = formatTime(studySeconds);
      document.getElementById('gameTimer').innerText = formatTime(gameSeconds);

      document.getElementById('totalStudied').innerText = `${Math.floor(totalStudiedSec / 60)}m`;
      document.getElementById('totalPlayed').innerText = `${Math.floor(totalPlayedSec / 60)}m`;
    }

    function setStudyTime(mins) {
      if (mode !== 'idle') return;
      studySeconds = mins * 60;
      updateDisplays();
    }

    function setGameTime(mins) {
      if (mode !== 'idle') return;
      gameSeconds = mins * 60;
      updateDisplays();
    }

    function startStudy() {
      if (mode === 'study') return;
      clearInterval(activeInterval);
      mode = 'study';

      document.getElementById('studyCard').className = 'bg-slate-900/90 border-2 rounded-2xl p-4 text-center transition-all duration-300 glow-cyan';
      document.getElementById('gameCard').className = 'bg-slate-900/80 border-2 border-slate-800 rounded-2xl p-4 text-center transition-all duration-300';

      playChime('start');
      const task = document.getElementById('taskInput').value.trim();
      let msg = "Study mode engaged!";
      if (task) msg += ` Working on ${task}.`;
      msg += " Focus up!";
      speakAI(msg);

      activeInterval = setInterval(() => {
        if (studySeconds > 0) {
          studySeconds--;
          totalStudiedSec++;
          updateDisplays();
        } else {
          clearInterval(activeInterval);
          playChime('alert');
          speakAI("ebic study session finished! You earned your game break!");
          mode = 'idle';
          resetCardStyles();
        }
      }, 1000);
    }

    function startGame() {
      if (mode === 'game') return;
      clearInterval(activeInterval);
      mode = 'game';

      document.getElementById('gameCard').className = 'bg-slate-900/90 border-2 rounded-2xl p-4 text-center transition-all duration-300 glow-pink';
      document.getElementById('studyCard').className = 'bg-slate-900/80 border-2 border-slate-800 rounded-2xl p-4 text-center transition-all duration-300';

      playChime('start');
      speakAI("Game on! Time to destroy the competition!");

      activeInterval = setInterval(() => {
        if (gameSeconds > 0) {
          gameSeconds--;
          totalPlayedSec++;

          if (gameSeconds === 60) {
            playChime('alert');
            speakAI("Warning: 60 seconds left on your game break! Finish your match!");
          }

          updateDisplays();
        } else {
          clearInterval(activeInterval);
          playChime('alert');
          speakAI("Game break ended! Step back into the study arena!");
          mode = 'idle';
          resetCardStyles();
        }
      }, 1000);
    }

    function resetTimers() {
      clearInterval(activeInterval);
      mode = 'idle';
      resetCardStyles();
      playChime('start');
      speakAI("Timers paused and reset!");
    }

    function resetCardStyles() {
      document.getElementById('studyCard').className = 'bg-slate-900/80 border-2 border-slate-800 rounded-2xl p-4 text-center transition-all duration-300';
      document.getElementById('gameCard').className = 'bg-slate-900/80 border-2 border-slate-800 rounded-2xl p-4 text-center transition-all duration-300';
    }

    updateDisplays();
  </script>
</body>
</html>
